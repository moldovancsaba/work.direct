<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="-112 -108 224 216" shape-rendering="geometricPrecision">
  <defs>
    <!-- Regular pointy-top hexagon of size s=40 centered at (0,0) -->
    <g id="hex">
      <polygon points="0,-40 34.641,-20 34.641,20 0,40 -34.641,20 -34.641,-20" />
    </g>
    <style><![CDATA[
      .ring { fill: #4a90e2; stroke: #0d47a1; stroke-width: 1; }
      .center { fill: #1e88e5; stroke: #0d47a1; stroke-width: 1; }
    ]]></style>
  </defs>

  <!-- 2-3-2 hexagon flower: rows at y=-60, 0, +60; hexes touch edge-to-edge -->
  <g class="ring">
    <!-- Middle row (outer two) -->
    <use href="#hex" transform="translate(-69.282 0)"/>
    <use href="#hex" transform="translate(69.282 0)"/>
    <!-- Top row (2) -->
    <use href="#hex" transform="translate(-34.641 -60)"/>
    <use href="#hex" transform="translate(34.641 -60)"/>
    <!-- Bottom row (2) -->
    <use href="#hex" transform="translate(-34.641 60)"/>
    <use href="#hex" transform="translate(34.641 60)"/>
  </g>

  <!-- Center hex -->
  <g class="center">
    <use href="#hex" transform="translate(0 0)"/>
  </g>
</svg>