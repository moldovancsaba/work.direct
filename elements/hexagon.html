<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2-3-2 Hex Flower — v1.3</title>
<style>
  :root{
    /* JS sets --W and --scale to guarantee fit after 30° rotation */
    --W: 120px;                                /* flat-top hex width */
    --H: calc(var(--W) * 0.8660254037844386);  /* H = W * √3 / 2 */
    --scale: 1;

    --bg: radial-gradient(1200px 800px at 50% 45%, #0a1224 0%, #070d1b 50%, #04070f 100%);
    --frontA: #4a90e2;
    --frontB: #7bd389;
    --stroke: #0d47a1;
    --outline: 1.5px;
    --duration: 520ms;
    --easing: cubic-bezier(.2,.7,.2,1);
    --pink: #ff66aa;
  }

  html, body{
    height:100%;
    margin:0;
    background: var(--bg);
    overflow:hidden; /* hard guarantee: no scrollbars */
    color:#cfe3ff;
  }

  /* Version badge (top-right) */
  .version{
    position:fixed;
    top:10px; right:12px;
    z-index:10;
    font: 600 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background: rgba(0,0,0,.45);
    color:#fff;
    padding:6px 8px;
    border-radius:8px;
    letter-spacing:.02em;
    user-select:none;
  }

  /* Fullscreen centering */
  .stage{
    position:fixed; inset:0;
    display:grid;
    place-items:center;
    padding:2vmin;
  }

  /* The cluster origin (0,0) sits exactly at the screen center.
     We rotate 30° and scale around that origin, so it's perfectly centered. */
  .flower-wrap{
    position:relative;
    width:0; height:0;          /* important: origin is this element's top-left */
    transform-origin: 0 0;       /* rotate around (0,0) which we place at screen center */
    transform: rotate(30deg) scale(var(--scale));
  }

  /* Absolute layout by *center points* using left/top = (x,y). */
  .flower{ position:relative; width:0; height:0; }

  /* Click area fixed to hex shape (clip-path on the button itself).
     This ensures the clickable/touchable region matches the visible hex. */
  .hex{
    position:absolute;
    width:var(--W);
    height:var(--H);
    transform: translate(-50%,-50%); /* treat left/top as center */
    border:none;
    background:transparent;
    padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;

    /* exact hit testing to shape */
    clip-path: polygon(
      25% 0%,
      75% 0%,
      100% 50%,
      75% 100%,
      25% 100%,
      0% 50%
    );
  }

  /* Visual content and flipping kept inside to preserve the hit shape above */
  .shape{
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    perspective: 1000px;
    position: relative;
  }

  .flip{
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    transition: transform var(--duration) var(--easing);
  }
  .hex[aria-pressed="true"] .flip{ transform: rotateY(180deg); }

  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border: var(--outline) solid var(--stroke);
    box-sizing: border-box;
  }
  .front{ background: linear-gradient(135deg, var(--frontA), var(--frontB)); }
  .back{
    background: var(--pink);   /* make flips obvious */
    transform: rotateY(180deg);
  }

  /* Optional center labels (hidden by default) */
  .label{
    position:absolute; inset:0; display:grid; place-items:center;
    font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:#06233a;
    mix-blend-mode:soft-light; user-select:none; pointer-events:none;
    opacity:0;
  }

  /* Keyboard focus */
  .hex:focus-visible .front, .hex:focus-visible .back{
    outline:3px solid #a0c2ff;
    outline-offset:2px;
  }

  @media (max-width:360px){ :root{ --outline: 1px; } }
</style>
</head>
<body>
  <div class="version">v1.3</div>

  <main class="stage" aria-label="Hexagon flower">
    <!-- This element sits exactly at screen center due to grid centering above.
         Its (0,0) is our rotation origin. -->
    <div class="flower-wrap">
      <section class="flower" role="group" aria-label="2-3-2 hex grid, touching">
        <!-- Axial coordinates (flat-top):
             r = -1 : q = 0, 1
             r =  0 : q = -1, 0, 1
             r = +1 : q = -1, 0
             Pixel (before rotation), with hex width W:
               x = 0.75 * W * q
               y = (√3/4 * W) * q + (√3/2 * W) * r
        -->

        <!-- Top row -->
        <button class="hex" type="button" data-q="0"  data-r="-1" aria-pressed="false" aria-label="Hex 1">
          <div class="shape"><div class="flip"><div class="face front"><div class="label">1</div></div><div class="face back"><div class="label">1</div></div></div></div>
        </button>
        <button class="hex" type="button" data-q="1"  data-r="-1" aria-pressed="false" aria-label="Hex 2">
          <div class="shape"><div class="flip"><div class="face front"><div class="label">2</div></div><div class="face back"><div class="label">2</div></div></div></div>
        </button>

        <!-- Middle row -->
        <button class="hex" type="button" data-q="-1" data-r="0"  aria-pressed="false" aria-label="Hex 3">
          <div class="shape"><div class="flip"><div class="face front"><div class="label">3</div></div><div class="face back"><div class="label">3</div></div></div></div>
        </button>
        <button class="hex" type="button" data-q="0"  data-r="0"  aria-pressed="false" aria-label="Hex 4 (center)">
          <div class="shape"><div class="flip"><div class="face front"><div class="label">4</div></div><div class="face back"><div class="label">4</div></div></div></div>
        </button>
        <button class="hex" type="button" data-q="1"  data-r="0"  aria-pressed="false" aria-label="Hex 5">
          <div class="shape"><div class="flip"><div class="face front"><div class="label">5</div></div><div class="face back"><div class="label">5</div></div></div></div>
        </button>

        <!-- Bottom row -->
        <button class="hex" type="button" data-q="-1" data-r="1"  aria-pressed="false" aria-label="Hex 6">
          <div class="shape"><div class="flip"><div class="face front"><div class="label">6</div></div><div class="face back"><div class="label">6</div></div></div></div>
        </button>
        <button class="hex" type="button" data-q="0"  data-r="1"  aria-pressed="false" aria-label="Hex 7">
          <div class="shape"><div class="flip"><div class="face front"><div class="label">7</div></div><div class="face back"><div class="label">7</div></div></div></div>
        </button>
      </section>
    </div>
  </main>

<script>
  // Geometry constants
  const SQRT3   = 1.7320508075688772;   // √3
  const HALF_S3 = SQRT3 / 2;            // √3/2
  const QTR_S3  = SQRT3 / 4;            // √3/4
  const DEG30   = Math.PI / 6;          // 30° in radians
  const COS30   = Math.cos(DEG30);
  const SIN30   = Math.sin(DEG30);

  // Flat-top axial -> pixel for hex centers (before rotation)
  // x = 0.75 * W * q
  // y = (√3/4 * W) * q + (√3/2 * W) * r
  function axialToPixel(q, r, W){
    const x = 0.75 * W * q;
    const y = (QTR_S3 * W) * q + (HALF_S3 * W) * r;
    return { x, y };
  }

  // Vertex offsets (before rotation) for a flat-top hex of size W×H, relative to center
  function hexVertexOffsets(W, H){
    return [
      { x:  0.25*W - 0.5*W, y: 0      - 0.5*H }, // (-0.25W, -0.5H)
      { x:  0.75*W - 0.5*W, y: 0      - 0.5*H }, // ( 0.25W, -0.5H)
      { x:  1.00*W - 0.5*W, y: 0.50*H - 0.5*H }, // ( 0.5W,   0)
      { x:  0.75*W - 0.5*W, y: 1.00*H - 0.5*H }, // ( 0.25W,  0.5H)
      { x:  0.25*W - 0.5*W, y: 1.00*H - 0.5*H }, // (-0.25W,  0.5H)
      { x:  0.00*W - 0.5*W, y: 0.50*H - 0.5*H }, // (-0.5W,   0)
    ];
  }

  // Rotate a point (x,y) by 30° around the origin
  function rot30(x, y){
    return { x: x*COS30 - y*SIN30, y: x*SIN30 + y*COS30 };
  }

  // Position hexes with centers recentered to (0,0)
  function layoutHexes(W){
    const buttons = Array.from(document.querySelectorAll('.hex'));
    const centers = buttons.map(btn => {
      const q = parseFloat(btn.dataset.q);
      const r = parseFloat(btn.dataset.r);
      return axialToPixel(q, r, W);
    });

    // Compute the geometric center of centers (symmetric here, but we do it robustly)
    const cx = centers.reduce((a,p)=>a+p.x,0) / centers.length;
    const cy = centers.reduce((a,p)=>a+p.y,0) / centers.length;

    // Place each hex so that the cluster center is at (0,0)
    centers.forEach((p, i) => {
      const x = p.x - cx;
      const y = p.y - cy;
      buttons[i].style.left = x + 'px';
      buttons[i].style.top  = y + 'px';
    });

    return { centers, cx, cy };
  }

  // Compute exact rotated bounding box from all hex vertices (not just centers)
  function rotatedBBoxFromVertices(W){
    const H   = W * 0.8660254037844386;    // √3/2 * W
    const vtx = hexVertexOffsets(W, H);

    let minX =  Infinity, minY =  Infinity;
    let maxX = -Infinity, maxY = -Infinity;

    document.querySelectorAll('.hex').forEach(btn => {
      const xC = parseFloat(btn.style.left) || 0; // centered around 0
      const yC = parseFloat(btn.style.top)  || 0;

      vtx.forEach(off => {
        const xr = xC + off.x;
        const yr = yC + off.y;
        // Rotate this absolute vertex around origin
        const { x, y } = rot30(xr, yr);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      });
    });

    return { minX, maxX, minY, maxY, width: maxX - minX, height: maxY - minY };
  }

  // Choose W and final scale so the rotated bbox never overflows.
  function fitAndRender(){
    const vw = Math.max(document.documentElement.clientWidth,  window.innerWidth  || 0);
    const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
    const margin = 0.96; // breathing room

    // Initial W from unrotated constraints (safe lower bound)
    const W_w = (vw * margin) / 2.5;
    const W_h = (vh * margin) / SQRT3;
    let W = Math.floor(Math.min(W_w, W_h));
    if (W < 16) W = 16; // avoid degenerate cases

    document.documentElement.style.setProperty('--W', W + 'px');

    // Place hexes centered at (0,0)
    layoutHexes(W);

    // Compute accurate rotated bbox from all vertices
    const bbox = rotatedBBoxFromVertices(W);

    // Final scale so bbox fits the viewport
    const sW = (vw * margin) / bbox.width;
    const sH = (vh * margin) / bbox.height;
    const scale = Math.min(sW, sH, 1); // don't upscale beyond 1

    document.documentElement.style.setProperty('--scale', String(scale));
  }

  function togglePress(e){
    const btn = e.currentTarget;
    const pressed = btn.getAttribute('aria-pressed') === 'true';
    btn.setAttribute('aria-pressed', String(!pressed));
  }

  function init(){
    fitAndRender();
    window.addEventListener('resize', fitAndRender, { passive:true });

    document.querySelectorAll('.hex').forEach(btn=>{
      btn.addEventListener('click', togglePress);
      btn.addEventListener('keydown', e=>{
        if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); btn.click(); }
      });
    });
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init, { once:true });
  } else {
    init();
  }
</script>
</body>
</html>
